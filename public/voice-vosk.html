<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vosk 6</title>
<style>
body{font-family:sans-serif;padding:16px;max-width:520px;margin:auto}
button{font-size:22px;padding:14px 22px;margin:4px 0}
#now{font-size:40px;font-weight:bold;text-align:center;margin:12px 0}
#lines div{font-size:18px;padding:1px 0}
.ok{color:#0a7d2c;font-weight:bold}
.cur{color:#c2185b;font-weight:bold}
.unk{color:#999}
.dan button.sel{background:#c2185b;color:#fff;border-color:#c2185b}
.sub{font-size:13px;color:#999;font-weight:normal}
pre{background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
</head><body>
<h1>Vosk 6</h1>
<div class="dan"><button id="dan3">3のだん</button> <button id="dan7">7のだん</button></div>
<p id="danlabel">音声認識テスト(3のだん)</p>
<p id="status">じゅんび中…</p>
<button id="start">はなす</button>
<button id="stop" disabled>おわり</button>
<div id="now">-</div>
<div id="lines"></div>
<h2>途中</h2>
<pre id="partial"></pre>
<h2>ログ</h2>
<button id="copy">ログをコピー</button> <span id="copymsg"></span>
<pre id="log"></pre>
<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += new Date().toLocaleTimeString() + ' ' + m + '\n'; };

const DANS = {
  3: ['さん いち が さん', 'さん に が ろく', 'さ ざん が く',
      'さん し じゅう に', 'さん ご じゅう ご', 'さぶ ろく じゅう はち',
      'さん しち に じゅう いち', 'さん ぱ に じゅう し', 'さん く に じゅう しち'],
  7: ['しち いち が しち', 'しち に じゅう し', 'しち さん に じゅう いち',
      'しち し に じゅう はち', 'しち ご さん じゅう ご', 'しち ろく し じゅう に',
      'しち しち し じゅう く', 'しち は ご じゅう ろく', 'しち く ろく じゅう さん']
};
const DAN_KEY = 'voiceVosk.dan';
let dan = 3;
try { const v = Number(localStorage.getItem(DAN_KEY)); if (DANS[v]) dan = v; } catch (e) {}
let PHRASES = DANS[dan];
const grammarFor = d => JSON.stringify(DANS[d].concat(['[unk]']));

let model = null, rec = null, ctx = null, stream = null, node = null, sink = null, timer = null;
let active = false, finished = false, marks = {}, heard = [], used = [];

const t0 = performance.now();
const modelPromise = Vosk.createModel('/models/ja-small.tar.gz');
modelPromise.then(m => {
  model = m;
  log('モデル読み込み完了 ' + ((performance.now() - t0) / 1000).toFixed(1) + '秒');
  if (!active) $('status').textContent = '「はなす」を押して、3のだんを言ってね';
}).catch(e => {
  log('モデル読み込み失敗: ' + e);
  $('status').textContent = 'じゅんびに失敗しました。ページを開き直してください';
});

function lastMarked() {
  let last = -1;
  PHRASES.forEach((_, i) => { if (marks[i]) last = i; });
  return last;
}

function render() {
  const last = lastMarked();
  let html = '';
  PHRASES.forEach((p, i) => {
    let cls = '', head = '・ ', sub = '';
    if (marks[i]) { cls = 'ok'; head = '◯ '; if (marks[i] === 'near') sub = ' <span class="sub">(1語ちがい)</span>'; }
    else if (i < last || finished) { cls = 'unk'; head = '？ '; sub = ' <span class="sub">(きこえなかった)</span>'; }
    else if (i === last + 1 && active) { cls = 'cur'; head = '▶ '; }
    html += '<div class="' + cls + '">' + head + dan + '×' + (i + 1) + ' ' + p.replace(/ /g, '') + sub + '</div>';
  });
  $('lines').innerHTML = html;
  if (finished) $('now').textContent = 'できた!';
  else if (active) $('now').textContent = last + 1 < 9 ? dan + ' × ' + (last + 2) : 'できた!';
  else $('now').textContent = '-';
}

function wordDist(a, b) {
  const dp = [];
  for (let i = 0; i <= a.length; i++) { dp.push([i]); }
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return dp[a.length][b.length];
}

// 聞きとった語の列 heard の中から「行 i に1語ちがい以内でそろう区間」をさがす。
// ひとつの語は1つの行にしか使わない(used)。候補は 距離が小さい → 次に言うはずの行に近い → 長い区間 の順で1つずつ確定する。
function bestCandidate() {
  const next = PHRASES.findIndex((_, i) => !marks[i]);
  let best = null;
  PHRASES.forEach((p, i) => {
    if (marks[i]) return;
    const pw = p.split(' ');
    for (let len = Math.max(1, pw.length - 1); len <= pw.length + 1; len++) {
      for (let s = 0; s + len <= heard.length; s++) {
        let free = true;
        for (let k = s; k < s + len; k++) if (used[k]) { free = false; break; }
        if (!free) continue;
        const d = wordDist(heard.slice(s, s + len), pw);
        if (d > 1) continue;
        const c = { i, s, len, d, pri: i - next };
        if (!best || (c.d - best.d || c.pri - best.pri || best.len - c.len || c.s - best.s) < 0) best = c;
      }
    }
  });
  return best;
}

function judge(text) {
  const w = text.trim().split(/\s+/).filter(Boolean);
  if (!w.length) return;
  heard = heard.concat(w);
  used = used.concat(w.map(() => false));
  const found = [];
  for (let c = bestCandidate(); c; c = bestCandidate()) {
    marks[c.i] = c.d === 0 ? 'ok' : 'near';
    for (let k = c.s; k < c.s + c.len; k++) used[k] = true;
    found.push(dan + '×' + (c.i + 1) + (c.d === 0 ? '◯' : '◯(1語ちがい)'));
  }
  log('結果: ' + text + ' → ' + (found.length ? found.join(' ') : '新しい一致なし'));
  render();
  if (active && marks[8]) stopAll(dan + '×9まで言えた');
}

async function stopAll(reason) {
  if (!active) return;
  active = false; finished = true;
  clearTimeout(timer);
  try { if (node) node.disconnect(); } catch (e) {}
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (ctx) await ctx.close(); } catch (e) {}
  try { if (rec) rec.remove(); } catch (e) {}
  node = stream = ctx = rec = null;
  $('start').disabled = false; $('stop').disabled = true;
  setDanButtons(false);
  $('status').textContent = 'おしまい(' + reason + ')。もう一回なら「はなす」';
  log('停止: ' + reason);
  const ok = PHRASES.filter((_, i) => marks[i] === 'ok').length;
  const near = PHRASES.filter((_, i) => marks[i] === 'near').length;
  log('集計: 完全一致' + ok + ' 1語ちがい' + near + ' きこえなかった' + (9 - ok - near));
  render();
}

$('start').onclick = async () => {
  marks = {}; heard = []; used = []; finished = false;
  setDanButtons(true);
  $('partial').textContent = '';
  $('start').disabled = true;
  try {
    ctx = new AudioContext();
    stream = await navigator.mediaDevices.getUserMedia({
      video: false,
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
    if (!model) {
      $('status').textContent = 'じゅんび中…ちょっとまってね';
      log('モデル待ち');
      await modelPromise;
    }
    if (ctx.state === 'suspended') await ctx.resume();
    log('sampleRate ' + ctx.sampleRate);
    rec = new model.KaldiRecognizer(ctx.sampleRate, grammarFor(dan));
    log(dan + 'のだん で開始');
    rec.on('result', m => judge(m.result.text || ''));
    rec.on('partialresult', m => { $('partial').textContent = m.result.partial || ''; });
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = ev => { try { if (active && rec) rec.acceptWaveform(ev.inputBuffer); } catch (e) { log('acceptWaveform失敗: ' + e); } };
    sink = ctx.createGain(); sink.gain.value = 0;
    ctx.createMediaStreamSource(stream).connect(node);
    node.connect(sink); sink.connect(ctx.destination);
    active = true;
    $('stop').disabled = false;
    $('status').textContent = 'きいてるよ。さいごまで言ってね';
    timer = setTimeout(() => stopAll('時間切れ(90秒)'), 90000);
    log('start');
    render();
  } catch (e) {
    log('開始失敗: ' + e);
    active = true;
    stopAll('開始失敗');
  }
};
$('stop').onclick = () => stopAll('おわりボタン');
function setDanButtons(disabled) {
  [3, 7].forEach(d => {
    const b = $('dan' + d);
    b.disabled = disabled;
    b.className = d === dan ? 'sel' : '';
  });
  $('danlabel').textContent = '音声認識テスト(' + dan + 'のだん)';
}
function selectDan(d) {
  if (active || !DANS[d]) return;
  dan = d; PHRASES = DANS[d];
  marks = {}; heard = []; used = []; finished = false;
  try { localStorage.setItem(DAN_KEY, String(d)); } catch (e) {}
  $('partial').textContent = '';
  log(d + 'のだん にきりかえ');
  setDanButtons(false);
  render();
}
$('dan3').onclick = () => selectDan(3);
$('dan7').onclick = () => selectDan(7);
$('copy').onclick = async () => {
  const text = $('log').textContent;
  try { await navigator.clipboard.writeText(text); $('copymsg').textContent = 'コピーしました'; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    $('copymsg').textContent = ok ? 'コピーしました' : 'コピーできませんでした(ログを長押しして選択してください)';
  }
};
setDanButtons(false);
render();
</script></body></html>
